name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El wrapper descarga Maven de Maven Central y a veces el runner no llega ("wget: Failed to fetch",
      # intermitente): se cachea la distribución (setup-java solo cachea ~/.m2/repository) y se reintenta.
      - name: Cachear la distribución de Maven del wrapper
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Preparar Maven (con reintentos)
        working-directory: backend
        run: |
          chmod +x mvnw
          for intento in 1 2 3 4 5; do
            ./mvnw -B -q --version && exit 0
            echo "No se pudo descargar Maven (intento $intento de 5); reintento en $((intento * 10)) s"
            sleep $((intento * 10))
          done
          exit 1
      - name: Pruebas sobre H2 (perfil test)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  it-mysql:
    name: it-mysql
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/dentaflow
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El wrapper descarga Maven de Maven Central y a veces el runner no llega ("wget: Failed to fetch",
      # intermitente): se cachea la distribución (setup-java solo cachea ~/.m2/repository) y se reintenta.
      - name: Cachear la distribución de Maven del wrapper
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Preparar Maven (con reintentos)
        working-directory: backend
        run: |
          chmod +x mvnw
          for intento in 1 2 3 4 5; do
            ./mvnw -B -q --version && exit 0
            echo "No se pudo descargar Maven (intento $intento de 5); reintento en $((intento * 10)) s"
            sleep $((intento * 10))
          done
          exit 1
      # MySQL preinstalado en el runner (usuario root/root), sin contenedores (DD-09).
      - name: Levantar MySQL del runner
        run: |
          sudo systemctl start mysql.service
          mysql --version
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS dentaflow CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; SELECT VERSION();"
      - name: Pruebas @Tag("mysql") contra MySQL 8
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Pit-mysql

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # E2E de los flujos del corte (C-19, design D6): backend en `dev` contra el MySQL preinstalado del
  # runner (sin contenedores, DD-09), frontend compilado con `vite preview` y Playwright con Chromium.
  # Las credenciales son de prueba, solo para la base efímera de este job.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/dentaflow
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AUTH_SECRET: clave-solo-para-el-job-e2e-de-ci-no-es-un-secreto
      APP_ADMIN_EMAIL: admin-e2e@example.com
      APP_ADMIN_PASSWORD: contrasena-e2e-solo-ci
      APP_BASE_URL: http://localhost:4173
      E2E_BASE_URL: http://localhost:4173
      E2E_ADMIN_EMAIL: admin-e2e@example.com
      E2E_ADMIN_PASSWORD: contrasena-e2e-solo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El wrapper descarga Maven de Maven Central y a veces el runner no llega ("wget: Failed to fetch",
      # intermitente): se cachea la distribución (setup-java solo cachea ~/.m2/repository) y se reintenta.
      - name: Cachear la distribución de Maven del wrapper
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Preparar Maven (con reintentos)
        working-directory: backend
        run: |
          chmod +x mvnw
          for intento in 1 2 3 4 5; do
            ./mvnw -B -q --version && exit 0
            echo "No se pudo descargar Maven (intento $intento de 5); reintento en $((intento * 10)) s"
            sleep $((intento * 10))
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar MySQL del runner
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS dentaflow CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
      - name: Levantar backend (perfil dev, con seed de demo)
        working-directory: backend
        run: |
          chmod +x mvnw
          nohup ./mvnw -B -q spring-boot:run -Dspring-boot.run.profiles=dev > ../backend.log 2>&1 &
      - name: Compilar y servir frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../frontend.log 2>&1 &
      - name: Esperar backend y frontend
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health | grep -q UP && curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 2
          done
          tail -50 backend.log; tail -20 frontend.log; exit 1
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend
        run: npm run e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
