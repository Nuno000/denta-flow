# Pruebas @Tag("mysql") contra MySQL 8 real (local o el preinstalado en el runner de CI).
spring:
  config:
    # .env de la raíz del repo (o de backend/), si existe. Las variables de entorno reales tienen prioridad.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dentaflow}
    username: ${SPRING_DATASOURCE_USERNAME:dentaflow}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    # Changes paralelos pueden mergear migraciones con versión menor a la ya aplicada en la base local.
    out-of-order: true

# Clave de firma SOLO DE PRUEBAS (C-04, design D2): fija, para no depender del AUTH_SECRET del .env local.
app:
  auth:
    secreto: clave-solo-para-pruebas-automatizadas-no-usar-en-produccion
  # Los tests no crean el administrador inicial en la base local.
  seed:
    admin: false
