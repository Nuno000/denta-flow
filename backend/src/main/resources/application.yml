# Configuración común a todos los perfiles (design D3).
# Los valores sensibles llegan siempre por variables de entorno (ver .env.example en la raíz).
spring:
  application:
    name: dentaflow-backend
  flyway:
    locations: classpath:db/migration
  jpa:
    # El esquema lo crea Flyway; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # Mapeo JPA por dominio en XML (las clases de dominio no llevan anotaciones). Un archivo por dominio.
    mapping-resources:
      - META-INF/orm/recursos.xml
      - META-INF/orm/usuarios.xml
      - META-INF/orm/configuracion.xml
      - META-INF/orm/auditoria.xml
    properties:
      hibernate:
        # Los instantes se guardan en UTC (DATETIME(6)) y se mapean a Instant.
        jdbc:
          time_zone: UTC

# Render y Vercel terminan TLS en su proxy: se respeta X-Forwarded-Proto para saber que el pedido
# llegó por HTTPS y mandar HSTS (C-15, design D8).
server:
  forward-headers-strategy: framework

# Sin datos personales en logs (C-15, design D7): ante una violación de clave única, Hibernate escribe
# los valores repetidos (DNI, email). La excepción igual se propaga y los servicios la traducen a 409.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

# Actuator: solo el estado de salud, público y sin detalles ni datos personales.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  # Autenticación del personal (C-04, design D2 y D7). Sin AUTH_SECRET de >= 32 bytes la aplicación no arranca.
  auth:
    secreto: ${AUTH_SECRET:}
    duracion-token: PT8H
    emisor: dentaflow
    intentos-maximos: 5
    ventana-intentos: PT15M
  # Administrador inicial (C-04, design D11): se crea al arrancar si no hay ningún administrador activo.
  seed:
    admin: true
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  # Orígenes del frontend que pueden llamar a la API desde el navegador (CORS). Lista separada por comas.
  cors:
    origenes-permitidos: ${APP_BASE_URL:http://localhost:5173}
